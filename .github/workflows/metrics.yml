name: Generate Metrics

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      # Overview + contribution calendar (light / dark)
      - name: overview (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics/overview.svg
          user: jessai2026
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          config_theme: light
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: overview (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics/overview-dark.svg
          user: jessai2026
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          config_theme: dark
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Languages (light / dark)
      - name: languages (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics/languages.svg
          user: jessai2026
          base: ""
          config_timezone: Asia/Shanghai
          config_theme: light
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

      - name: languages (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics/languages-dark.svg
          user: jessai2026
          base: ""
          config_timezone: Asia/Shanghai
          config_theme: dark
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

name: Generate Metrics

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: profile metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics/metrics.svg
          user: jessai2026
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          repositories_affiliations: owner, collaborator, organization_member
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_ignored: html, css
          # Single file that adapts to GitHub's light and dark themes
          extras_css: |
            @media (prefers-color-scheme: dark) {
              svg { color: #c9d1d9; }
              h2, h3 { color: #58a6ff; }
              .field svg, h2 svg, h3 svg { fill: #8b949e; }
              rect.day[fill="#ebedf0"] { fill: #161b22; }
            }
